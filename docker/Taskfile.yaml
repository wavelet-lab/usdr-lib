version: '3'

vars:
  PACKAGE_DIR_NAME:
    sh: "echo $PACKAGE_DIR_NAME"
  PACKAGE_ARCH_NAME:
    sh: "echo $PACKAGE_ARCH_NAME"
  OUTPUT_DIR_NAME:
    sh: "echo $PACKAGE_DIR_NAME-$PACKAGE_ARCH_NAME"
  PACKAGE_CODENAME:
    sh: "printf '%s\n' \"$PACKAGE_DIR_NAME\" | cut -d- -f2-"
  PACKAGE_DISTRIBUTION:
    sh: "if [ \"$PACKAGE_DIR_NAME\" = debian-bookworm ]; then echo stable; else printf '%s\n' \"$PACKAGE_DIR_NAME\" | cut -d- -f2-; fi"

tasks:

  clean:
    desc: Clean the build environment
    preconditions:
      - sh: test -n "{{.PACKAGE_DIR_NAME}}"
        msg: "PACKAGE_DIR_NAME env var is not set"
      - sh: test -n "{{.PACKAGE_ARCH_NAME}}"
        msg: "PACKAGE_ARCH_NAME env var is not set"
      - sh: test -d "/work/source/packaging/{{.PACKAGE_DIR_NAME}}"
        msg: "Package `{{.PACKAGE_DIR_NAME}}` directory not found"
    cmds:
      - rm -rf /work/build
      - rm -rf /work/output/{{.OUTPUT_DIR_NAME}}
      - mkdir -p /work/build/source
      - mkdir -p /work/output/{{.OUTPUT_DIR_NAME}}

  prepare:
    desc: Prepare the build environment
    deps:
      - clean
    preconditions:
      - test -d /work/source
    dir: /work/build/source
    cmds:
      - |
        cp -a \
          /work/source/src \
          /work/source/LICENSE \
          /work/source/README.md \
          .
        mkdir -p packaging
        cp -a \
          /work/source/packaging/control-packages \
          /work/source/packaging/generate-debian-changelog.sh \
          /work/source/packaging/generate-debian-control.sh \
          /work/source/packaging/package-metadata \
          /work/source/packaging/{{.PACKAGE_DIR_NAME}} \
          packaging/
      - ln -s packaging/{{.PACKAGE_DIR_NAME}} debian
      - packaging/generate-debian-control.sh {{.PACKAGE_DIR_NAME}} debian/control
      - packaging/generate-debian-changelog.sh src/Changelog.txt {{.PACKAGE_CODENAME}} {{.PACKAGE_DISTRIBUTION}} debian/changelog

  deb:
    desc: Build the debian packages
    deps:
      - prepare
    dir: /work/build/source
    cmds:
      - echo "#!/usr/bin/env sh" > /usr/bin/lintian # dirty hack to disable lintian
      - echo "exit 0" >> /usr/bin/lintian
      - DH_VERBOSE=1 debuild -us -uc
      - cp -ra /work/build/*.deb /work/output/{{.OUTPUT_DIR_NAME}}/

  ppa:
    desc: Upload the package to the launchpad/ppa
    deps:
      - prepare
    preconditions:
      - test -d /mnt/gnupg
    dir: /work/build/source
    cmds:
      - rm -rf /root/.gnupg
      - cp -ra /mnt/gnupg /root/.gnupg 2>/dev/null | true
      - rm -rf /root/.gnupg/S.* /root/.gnupg/public-keys.d/.* /root/.gnupg/public-keys.d/*.lock
      - gpg-agent --daemon
      - debuild -S
      - dput ppa:wavelet-lab/usdr-lib /work/build/*.changes
